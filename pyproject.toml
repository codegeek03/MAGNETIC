[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainable-packaging"
version = "0.1.0"
description = "Multi-Agent Architecture for Sustainable Packaging Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.3.1",
    "google-genai>=1.10.0",
    "langgraph>=0.3.30",
    "langchain-core>=0.3.51",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.5.0",
    "duckduckgo_search>=7.0.0",
    "newspaper4k>=0.9.3",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]
